media:
  input: public/media
  output: /media
  categories: [image]
  rename: safe

content:
  - name: announcements
    label: Thông báo
    description: Tạo, sửa và xuất bản thông báo học vụ.
    type: collection
    path: src/content/announcements
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    operations: { create: true, rename: false, delete: true }
    view:
      fields: [title, published, important, published_date]
      primary: title
      sort: [published_date, title]
      default: { sort: published_date, order: desc }
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
        options: { maxlength: 200 }
      - name: summary
        label: Tóm tắt
        type: text
        options: { maxlength: 300 }
      - name: category
        label: Danh mục
        type: reference
        required: true
        options: { collection: categories, value: "{name}", label: "{fields.name}", search: name }
      - name: published
        label: Đã xuất bản
        description: Bật để hiển thị trên trang công khai. Chỉ nhập nội dung được phép công khai, kể cả khi chưa bật.
        type: boolean
        default: false
      - { name: important, label: Quan trọng (ghim trang chủ), type: boolean, default: false }
      - { name: published_date, label: Ngày đăng, type: date, required: true, options: { format: yyyy-MM-dd } }
      - name: deadline
        label: Hạn chót (nếu có)
        description: Không tự động ẩn hoặc xuất bản thông báo theo hạn chót.
        type: date
        default: ""
        options: { format: yyyy-MM-dd }
      - name: attachments
        label: Tệp / đường dẫn đính kèm
        description: Dán đường dẫn tài liệu đã kiểm tra quyền xem; không tải tài liệu lên đây.
        type: object
        list: true
        fields:
          - { name: label, label: Tên hiển thị, type: string, required: true }
          - name: url
            label: Đường dẫn
            type: string
            required: true
            pattern: { regex: '^https://', message: Đường dẫn phải bắt đầu bằng https:// }
          - name: note
            label: Quyền truy cập
            type: select
            options: { values: [Công khai, Yêu cầu tài khoản IU] }
      - { name: body, label: Nội dung, type: rich-text, options: { format: markdown, switcher: false } }

  - name: categories
    label: Danh mục học vụ
    description: Quản lý tên, mô tả và thứ tự các danh mục học vụ.
    type: collection
    path: src/content/categories
    format: yaml
    filename: "{fields.slug}.yml"
    operations: { create: true, rename: false, delete: true }
    view:
      fields: [name, published, order]
      primary: name
      sort: [order, name]
      default: { sort: order, order: asc }
    fields:
      - { name: name, label: Tên danh mục, type: string, required: true }
      - name: slug
        label: Mã danh mục
        description: Nhập chữ thường không dấu, chữ số và dấu gạch nối khi tạo; giữ nguyên mã sau khi lưu.
        type: string
        required: true
        pattern: { regex: '^[a-z0-9-]+$', message: Chỉ dùng chữ thường không dấu, chữ số và dấu gạch nối. }
      - { name: description, label: Mô tả, type: text }
      - { name: order, label: Thứ tự hiển thị, type: number, required: true, options: { min: 0 } }
      - { name: published, label: Đã xuất bản, type: boolean, default: true }
      - name: drive_folder_url
        label: Đường dẫn thư mục tài liệu
        description: Chỉ điền sau khi đã kiểm tra quyền xem của thư mục.
        type: string
        pattern: { regex: '^https://', message: Đường dẫn phải bắt đầu bằng https:// }
      - name: drive_access
        label: Quyền truy cập thư mục
        type: select
        options: { values: [Công khai, Yêu cầu tài khoản IU] }

  - name: guides
    label: Hướng dẫn
    description: Soạn hướng dẫn theo danh mục và đính kèm đường dẫn tài liệu.
    type: collection
    path: src/content/guides
    format: yaml-frontmatter
    filename: "{primary}.md"
    operations: { create: true, rename: false, delete: true }
    view:
      fields: [title, published, updated_date, order]
      primary: title
    fields:
      - { name: title, label: Tiêu đề, type: string, required: true }
      - name: category
        label: Danh mục
        type: reference
        required: true
        options: { collection: categories, value: "{name}", label: "{fields.name}", search: name }
      - { name: summary, label: Tóm tắt, type: text }
      - { name: body, label: Nội dung, type: rich-text, options: { format: markdown, switcher: false } }
      - name: attachments
        label: Tệp / đường dẫn đính kèm
        description: Dán đường dẫn tài liệu đã kiểm tra quyền xem; không tải tài liệu lên đây.
        type: object
        list: true
        fields:
          - { name: label, label: Tên hiển thị, type: string, required: true }
          - name: url
            label: Đường dẫn
            type: string
            required: true
            pattern: { regex: '^https://', message: Đường dẫn phải bắt đầu bằng https:// }
          - name: note
            label: Quyền truy cập
            type: select
            options: { values: [Công khai, Yêu cầu tài khoản IU] }
      - { name: updated_date, label: Ngày cập nhật, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: published, label: Đã xuất bản, type: boolean, default: false }
      - { name: order, label: Thứ tự hiển thị, type: number }

  - name: resources
    label: Biểu mẫu / Tài liệu
    description: Quản lý đường dẫn biểu mẫu và tài liệu; kiểm tra quyền xem trước khi xuất bản.
    type: collection
    path: src/content/resources
    format: yaml
    filename: "{year}{month}{day}-{primary}.yml"
    operations: { create: true, rename: false, delete: true }
    view:
      fields: [title, published, updated_date]
      primary: title
    fields:
      - { name: title, label: Tiêu đề, type: string, required: true }
      - { name: description, label: Mô tả, type: text }
      - name: category
        label: Danh mục
        type: reference
        required: true
        options: { collection: categories, value: "{name}", label: "{fields.name}", search: name }
      - name: external_url
        label: Đường dẫn tài liệu / biểu mẫu
        type: string
        required: true
        pattern: { regex: '^https://', message: Đường dẫn phải bắt đầu bằng https:// }
      - name: file_type
        label: Loại tài liệu
        type: select
        options: { values: [PDF, Word, Excel, Google Form, Google Docs, Thư mục, Khác] }
      - name: access
        label: Quyền truy cập
        type: select
        options: { values: [Công khai, Yêu cầu tài khoản IU] }
      - { name: updated_date, label: Ngày cập nhật, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: published, label: Đã xuất bản, type: boolean, default: false }

  - name: faq
    label: Câu hỏi thường gặp
    description: Soạn câu hỏi và câu trả lời theo danh mục học vụ.
    type: collection
    path: src/content/faq
    format: yaml-frontmatter
    filename: "{primary}.md"
    operations: { create: true, rename: false, delete: true }
    view:
      fields: [question, published, order]
      primary: question
    fields:
      - { name: question, label: Câu hỏi, type: string, required: true }
      - { name: answer, label: Câu trả lời, type: rich-text, options: { format: markdown, switcher: false } }
      - name: category
        label: Danh mục (nếu có)
        type: reference
        options: { collection: categories, value: "{name}", label: "{fields.name}", search: name }
      - { name: order, label: Thứ tự hiển thị, type: number }
      - { name: published, label: Đã xuất bản, type: boolean, default: false }

  - name: settings
    label: Cài đặt trang & Liên hệ
    description: Cập nhật giới thiệu, đường dẫn thường dùng và thông tin liên hệ đã được khoa xác nhận.
    type: file
    path: src/content/settings/site.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - { name: site_title, label: Tiêu đề trang, type: string, required: true }
      - { name: site_tagline, label: Dòng giới thiệu ngắn, type: string }
      - { name: intro, label: Giới thiệu trang chủ, type: text }
      - name: quick_links
        label: Thủ tục thường dùng
        type: object
        list: true
        fields:
          - { name: label, label: Tên hiển thị, type: string }
          - name: url
            label: Đường dẫn
            type: string
            pattern: { regex: '^https://', message: Đường dẫn phải bắt đầu bằng https:// }
      - name: contacts
        label: Đầu mối liên hệ
        description: Chỉ nhập thông tin liên hệ được khoa xác nhận và cho phép công khai.
        type: object
        list: true
        fields:
          - { name: role, label: Vai trò / bộ phận, type: string, required: true }
          - { name: name, label: Họ và tên, type: string }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Điện thoại, type: string }
          - { name: office, label: Văn phòng, type: string }
          - { name: hours, label: Giờ liên hệ, type: string }
          - { name: responsibilities, label: Nội dung phụ trách, type: string }
      - { name: contact_note, label: Ghi chú liên hệ, type: rich-text, options: { format: markdown, switcher: false } }
      - { name: footer_text, label: Nội dung chân trang, type: string }
      - name: faculty_website_url
        label: Đường dẫn website khoa
        type: string
        pattern: { regex: '^https://', message: Đường dẫn phải bắt đầu bằng https:// }
      - name: drive_root_url
        label: Đường dẫn thư mục học vụ chung
        description: Chỉ điền sau khi đã kiểm tra quyền xem của thư mục.
        type: string
        pattern: { regex: '^https://', message: Đường dẫn phải bắt đầu bằng https:// }
